    <rect x="140" y="140" width="106" height="106" rx="30" fill="#ff6b84"/>
    <rect x="266" y="140" width="106" height="106" rx="30" fill="#ffc531"/>
    <rect x="140" y="266" width="106" height="106" rx="30" fill="#3fc7f4"/>
    <rect x="266" y="266" width="106" height="106" rx="30" fill="#7be0c0"/>
  </g>
  <g>
    <circle cx="193" cy="193" r="42" fill="#ff6b84"/>
    <circle cx="319" cy="193" r="42" fill="#3fc7f4"/>
    <circle cx="193" cy="319" r="42" fill="#3fc7f4"/>
    <circle cx="319" cy="319" r="42" fill="#7be0c0"/>
  </g>
</svg>
